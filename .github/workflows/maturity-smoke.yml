name: Maturity sweep smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/maturity-smoke.yml"
      - "code/scripts/fleet_maturity_sweep.py"
      - "code/scripts/rescore_maturity_sweep.py"
      - "code/config/runs/fleet_maturity_sweep_smoke.yaml"
      - "code/src/**"
      - "code/tests/**"

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.2 scipy==1.16.1 pandas==2.3.1 matplotlib==3.10.3 scikit-learn==1.7.1 joblib==1.5.1 pyyaml==6.0.3 "pyarrow>=16.0" rich==14.3.2 pytest
      - name: Run unit tests
        run: pytest -q
      - name: Run maturity sweep smoke test
        run: python scripts/fleet_maturity_sweep.py --config config/runs/fleet_maturity_sweep_smoke.yaml
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-maturity-smoke
          path: |
            code/results/fleet_maturity_sweep_smoke/processed/
            code/results/fleet_maturity_sweep_smoke/run_manifest.yaml
          if-no-files-found: warn
