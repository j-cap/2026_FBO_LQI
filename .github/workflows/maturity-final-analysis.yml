name: Maturity final dense-reference analysis

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/maturity-final-analysis.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: code
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.2 scipy==1.16.1 pandas==2.3.1 matplotlib==3.10.3 scikit-learn==1.7.1 joblib==1.5.1 pyyaml==6.0.3 "pyarrow>=16.0" rich==14.3.2
      - name: Restore full maturity sweep artifact
        run: |
          mkdir -p results/fleet_maturity_sweep_c1cds02
          gh run download 36156917907 --repo "$GITHUB_REPOSITORY" -n fleet-maturity-sweep-full -D results/fleet_maturity_sweep_c1cds02
      - name: Generate dense independent offline reference
        run: |
          python scripts/generate_offline_reference.py \
            --config config/runs/fleet_maturity_sweep_c1cds02.yaml \
            --mode full --n-sobol 1024 --n-refine-starts 8 \
            --n-ref-test-per-maneuver 20 --n-jobs 4
      - name: Rescore maturity trajectories
        run: |
          python scripts/rescore_maturity_sweep.py \
            --config config/runs/fleet_maturity_sweep_c1cds02.yaml \
            --n-jobs 4 | tee maturity_final_analysis.txt
      - name: Generate maturity figures
        run: |
          python scripts/make_maturity_figures.py
      - name: Upload final analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-maturity-final-analysis
          path: |
            code/results/fleet_maturity_sweep_c1cds02_reference_robustness/processed/
            code/results/fleet_maturity_sweep_c1cds02_reference_robustness/run_manifest.yaml
            code/results/offline_reference/processed/dense_reference.csv
            code/results/offline_reference/run_manifest.yaml
            code/maturity_final_analysis.txt
            latex/figures/fig7a_fleet_maturity_absolute.pdf
            latex/figures/fig7b_fleet_maturity_savings.pdf
            latex/figures/fig7c_fleet_maturity_early_success.pdf
          if-no-files-found: warn
