# python scripts/phase1_oracle_landscapes.py --config config/runs/phase1b_nonlinear_mismatch_full.yaml
#
# Full-scale Phase 1B (60 clients, M=256), confirming
# results/phase1b_nonlinear_mismatch_smoke at doc's recommended scale. Identical to
# phase1a_matched_model_full_v2.yaml except plant_mode=nonlinear_tanh (see
# phase1b_nonlinear_mismatch_smoke.yaml / docs/phase1_diagnostic_findings.md Part 3).
# The smoke run's worst-case transfer risk (15.0%) sat right at the 15% decision
# threshold, so this scale matters more here than it did for Phase 1A.
kind: phase1_oracle_landscape
run_tag: phase1b_nonlinear_mismatch_full

fleet_config: config/fleet.yaml
controller_config: config/controller.yaml
fleet_overrides:
  clients_per_regime: 20
controller_overrides:
  plant_mode: nonlinear_tanh
  tire_mu: 1.0

n_sobol: 256
n_calibration_episodes: 10
n_test_episodes: 50
episode_base_seed: 5000
identification_seed_offset: 1000
n_identification_episodes: 8

n_clusters: 3
cluster_seed: 1337

fig_a_grid_resolution: 25

seed: 42
n_jobs: -1
